/* 桌面根图标层：用坐标(x/y)绝对定位 */
#icon-layer {
  position: absolute;
  inset: 0;
}
#icon-layer > .icon { position: absolute; }

/* 编辑模式下，桌面根图标可拖动 */
body.edit-mode #icon-layer > .icon { cursor: grab; }
body.edit-mode #icon-layer > .icon:active { cursor: grabbing; }

/* ===== 图标 ===== */
.icon {
  position: relative;
  width: 92px;
  padding: 10px 6px 8px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: background 0.12s;
}
.icon:hover { background: rgba(255, 255, 255, 0.05); }
.icon.selected { background: var(--select); }

.icon .glyph {
  width: 52px;
  height: 52px;
  display: block;
  margin: 0 auto 6px;
  object-fit: contain;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
}
.icon .glyph-emoji {
  display: block;
  width: 52px;
  height: 52px;
  margin: 0 auto 6px;
  font-size: 40px;
  line-height: 52px;
  text-align: center;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
}
.icon .label {
  font-size: 12px;
  color: var(--text);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  word-break: break-all;
  line-height: 1.3;
}

/* 上锁角标 */
.icon .lock-badge {
  position: absolute;
  top: 6px;
  right: 14px;
  font-size: 16px;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
}
.icon.unlocked .lock-badge { opacity: 0.35; }

/* 编辑模式：游玩时会被隐藏的文件（调律台还原 / 逐层揭示），半透明 + 虚线框提示 */
.icon.hidden-stub { opacity: 0.4; }
.icon.hidden-stub .glyph,
.icon.hidden-stub .glyph-emoji { filter: grayscale(0.6) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6)); }
.icon.hidden-stub .label { font-style: italic; }
.icon.hidden-stub::after {
  content: "🎵 隐藏";
  position: absolute;
  top: 4px;
  left: 8px;
  font-size: 10px;
  font-style: normal;
  color: var(--accent);
  background: rgba(0, 0, 0, 0.55);
  padding: 1px 4px;
  border-radius: 4px;
}

/* ===== 窗口 ===== */
.window {
  position: absolute;
  min-width: 260px;
  min-height: 140px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.window.focused { border-color: var(--accent-soft); }

.window-bar {
  height: 32px;
  background: var(--panel-bar);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 10px;
  cursor: move;
  flex: none;
}
.window-bar .title {
  font-size: 12px;
  color: var(--text);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.window-bar .rename {
  flex: none;
  margin-right: 8px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
}
.window-bar .rename:hover { color: var(--accent); }
.window-bar .title-input {
  width: 100%;
  background: var(--bg-0);
  border: 1px solid var(--accent);
  border-radius: 3px;
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  padding: 2px 6px;
  outline: none;
}
.window-bar .close {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #c75f5f;
  cursor: pointer;
  flex: none;
  transition: filter 0.12s;
}
.window-bar .close:hover { filter: brightness(1.25); }

.window-body {
  flex: 1;
  overflow: auto;
  padding: 16px;
}

/* 文本内容 */
.txt-body {
  white-space: pre-wrap;
  line-height: 1.7;
  font-size: 13.5px;
  color: var(--text);
  user-select: text;
}
.txt-body .speaker {
  color: #7fc3ff;
  font-weight: 600;
}

/* 图片内容 */
.img-body { text-align: center; }
.img-body img {
  max-width: 100%;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.img-body .caption {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-dim);
}

/* 文件夹内容：再放一组图标 */
.folder-body {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 4px;
}
.folder-body .empty {
  color: var(--text-dim);
  font-size: 12px;
  padding: 8px;
}

/* 上锁对话框 */
.lock-body { text-align: center; padding: 8px 4px; }
.lock-body .lock-icon { font-size: 40px; margin-bottom: 10px; }
.lock-body .hint {
  font-size: 12.5px;
  color: var(--text-dim);
  margin-bottom: 14px;
  line-height: 1.6;
}
.lock-body input {
  width: 80%;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  padding: 8px 10px;
  text-align: center;
  outline: none;
}
.lock-body input:focus { border-color: var(--accent); }
.lock-body .lock-btn {
  margin-top: 12px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  padding: 7px 22px;
  border-radius: 4px;
  cursor: pointer;
}
.lock-body .lock-btn:hover { filter: brightness(1.2); }
.lock-body .lock-error {
  margin-top: 10px;
  min-height: 16px;
  font-size: 12px;
  color: #d98a8a;
}

/* ===== 排序锁 ===== */
.order-lock .hint { line-height: 1.6; }
.order-lock .order-list { text-align: left; margin: 6px 0 2px; }
.order-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  margin: 6px 0;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 5px;
}
.order-row .order-rank { color: var(--accent); font-weight: bold; flex: none; width: 18px; }
.order-row .order-label { flex: 1; font-size: 13px; color: var(--text); }
.order-row .order-arrows { display: flex; gap: 4px; flex: none; }
.order-arrow {
  width: 24px;
  height: 22px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  cursor: pointer;
  font-size: 10px;
  line-height: 1;
}
.order-arrow:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.order-arrow:disabled { opacity: 0.3; cursor: default; }

/* ===== 认人锁 ===== */
.choice-lock .hint { line-height: 1.6; }
.choice-opt {
  display: block;
  width: 80%;
  margin: 8px auto 0;
  padding: 9px 10px;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.choice-opt:hover { border-color: var(--accent); background: rgba(255,255,255,0.03); }

/* 数字密码键盘面板 */
.numpad-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 14px 0 10px;
}
.numpad-cell {
  width: 30px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-family: monospace;
  color: var(--text);
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 5px;
}
.numpad-cell.filled { border-color: var(--accent); color: #7fc3ff; }
.numpad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 200px;
  margin: 6px auto 0;
}
.numpad-key {
  height: 42px;
  font-size: 17px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.numpad-key:hover { border-color: var(--accent); background: rgba(255,255,255,0.04); }
.numpad-key:active { background: var(--accent-soft); }
.numpad-key.numpad-fn { color: var(--accent); font-size: 16px; }

/* 记忆调律台（音乐锁） */
.memory-lock { max-width: 540px; }
.memory-lock .lock-icon { font-size: 30px; color: var(--accent); }
.mem-section {
  text-align: left;
  font-size: 12px;
  color: var(--muted, #8a99a8);
  margin: 14px 2px 8px;
}

/* 六根竖向推子，横排一行 */
.mem-faders {
  display: flex;
  flex-wrap: nowrap;
  justify-content: space-between;
  gap: 6px;
}
.mem-fader {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 2px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 8px;
  transition: border-color 0.12s, background 0.12s;
}
.mem-fader.on {
  border-color: var(--accent);
  background: var(--accent-soft, rgba(127,195,255,0.12));
}
.mem-emotion {
  font-size: 11px;
  color: var(--text);
  white-space: nowrap;
  min-height: 15px;
}
.mem-hr { color: #ff8a8a; font-variant-numeric: tabular-nums; }
.mem-slider {
  -webkit-appearance: slider-vertical;
  appearance: slider-vertical;
  writing-mode: vertical-lr;
  direction: rtl;            /* 下＝低(min)，上＝高(max) */
  width: 22px;
  height: 130px;
  accent-color: var(--accent);
  cursor: pointer;
}
.mem-present {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
}
.mem-present input { accent-color: var(--accent); cursor: pointer; margin: 0; }
.mem-fader-label { text-align: center; line-height: 1.25; }
.mem-fader-label .mem-inst-main { font-size: 13px; color: var(--text); font-weight: 600; }

/* 调律台 App：房间选择 + 还原成功提示 */
.tuner-app { max-width: 560px; }
.tuner-pick {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 2px 4px;
  font-size: 13px;
  color: var(--text);
}
.tuner-room-select {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
}
.tuner-room-select:focus { outline: none; border-color: var(--accent); }
.lock-error.tuner-ok { color: #4fd08a; }

/* 档案锁：代号 + 声纹下拉 */
.dossier-row .dossier-code {
  flex: none;
  min-width: 78px;
  font-family: monospace;
  letter-spacing: 0.5px;
  color: #7fc3ff;
  font-weight: 600;
}
.dossier-select {
  flex: 1;
  min-width: 0;
  padding: 5px 6px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  font-size: 12.5px;
  cursor: pointer;
}
.dossier-select:focus { outline: none; border-color: var(--accent); }

/* ===== 人物备注程序 ===== */
.notes-app { display: flex; flex-direction: column; }
.notes-intro {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
  margin-bottom: 12px;
}
.notes-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.notes-code { flex: 0 0 96px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
.notes-code .code { font-size: 13px; color: var(--accent); font-weight: bold; }
.notes-code .code-caret { font-size: 10px; color: var(--text-dim); }
.notes-code .code-caret::before { content: "▸"; }
.notes-row.expanded .code-caret::before { content: "▾"; }
.notes-code:hover .code { text-decoration: underline; }

.notes-dialogs { padding: 2px 0 8px 6px; border-bottom: 1px solid var(--line); }
.notes-dialogs-count { font-size: 11px; color: var(--text-dim); margin: 4px 0 6px; }
.notes-dialog-item {
  padding: 6px 8px;
  margin: 4px 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
  background: var(--bg-0);
  transition: border-color 0.12s, background 0.12s;
}
.notes-dialog-item:hover { border-color: var(--accent); background: rgba(255,255,255,0.03); }
.notes-dialog-item .ndi-title { font-size: 12px; color: var(--text); }
.notes-dialog-item .ndi-sub { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
.notes-row input {
  flex: 1;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  padding: 6px 8px;
  outline: none;
}
.notes-row input:focus { border-color: var(--accent); }

/* ===== 左下角系统信息 ===== */
#system-tag {
  position: absolute;
  left: 20px;
  bottom: 16px;
  pointer-events: none;
}
#system-name { font-size: 13px; color: var(--accent); letter-spacing: 1px; }
#boot-line { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* ===== 顶部工具栏（编辑模式入口）===== */
#toolbar {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 9000;
}
.tool-btn {
  background: rgba(20, 27, 36, 0.85);
  border: 1px solid var(--line);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: all 0.12s;
}
.tool-btn:hover { border-color: var(--accent); }
.tool-btn.active { background: var(--accent-soft); border-color: var(--accent); color: #eaf6fb; }
#edit-only { display: none; gap: 8px; align-items: center; }
body.edit-mode #edit-only { display: flex; }
#add-target {
  font-size: 11.5px;
  color: var(--text-dim);
  margin-right: 2px;
  white-space: nowrap;
}
#add-target b { color: var(--accent); }
#draft-status {
  font-size: 11.5px;
  color: var(--text-dim);
  white-space: nowrap;
  margin-right: 2px;
}
#draft-status.saved { color: #7fc4a3; }

/* ===== 右侧属性检查器 ===== */
#inspector {
  position: absolute;
  top: 60px;
  right: 14px;
  width: 280px;
  max-height: calc(100% - 90px);
  overflow: auto;
  background: rgba(20, 27, 36, 0.92);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  z-index: 8500;
  backdrop-filter: blur(6px);
  display: none;
}
body.edit-mode #inspector.shown { display: block; }
#inspector .insp-title {
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 1px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
}
.insp-field { margin-bottom: 11px; }
.insp-field label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.insp-field input[type="text"],
.insp-field textarea {
  width: 100%;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  padding: 6px 8px;
  outline: none;
  resize: vertical;
}
.insp-field input:focus,
.insp-field textarea:focus { border-color: var(--accent); }
.insp-field textarea { min-height: 120px; line-height: 1.5; }
.insp-check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text); }
.insp-check input { width: 15px; height: 15px; }
.insp-type-tag {
  display: inline-block;
  font-size: 11px;
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 8px;
}
.insp-field select {
  width: 100%;
  background: var(--bg-1);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 8px;
  font-size: 12.5px;
}
.insp-field input[type="number"] {
  width: 100%;
  background: var(--bg-1);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 8px;
  font-size: 12.5px;
}
.speaker-tool {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.speaker-tool-row {
  display: flex;
  gap: 6px;
}
.speaker-tool-row select { flex: 1 1 0; min-width: 0; }
.speaker-tool-row input[type="text"] { flex: 1 1 auto; min-width: 0; }
.speaker-tool-row button {
  flex: 0 0 auto;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 7px 9px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}
.speaker-tool-row button:hover { filter: brightness(1.2); }
.insp-mem-row {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  margin-bottom: 9px;
  background: var(--bg-1);
}
.insp-mem-head {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: space-between;
}
.insp-mem-inst { flex: 0 0 130px; width: 130px; }
.insp-mem-hr { display: flex; align-items: center; gap: 8px; }
.insp-mem-hr input[type="range"] { flex: 1 1 auto; }
.insp-hr { color: #ff8a8a; font-size: 12px; min-width: 44px; text-align: right; }
.insp-del {
  width: 100%;
  margin-top: 6px;
  background: #3a1f1f;
  border: 1px solid #6e3a3a;
  color: #e2a3a3;
  font-family: inherit;
  font-size: 12.5px;
  padding: 7px;
  border-radius: 4px;
  cursor: pointer;
}
.insp-del:hover { filter: brightness(1.25); }

/* ===== 导出窗口 ===== */
.export-body { display: flex; flex-direction: column; height: 100%; }
.export-body textarea {
  flex: 1;
  width: 100%;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  font-family: inherit;
  font-size: 11.5px;
  line-height: 1.45;
  padding: 8px;
  outline: none;
  resize: none;
  white-space: pre;
  overflow: auto;
}
.export-actions { display: flex; gap: 8px; margin-top: 10px; }
.export-actions button {
  flex: 1;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: #eaf6fb;
  font-family: inherit;
  font-size: 12.5px;
  padding: 8px;
  border-radius: 4px;
  cursor: pointer;
}
.export-actions button:hover { filter: brightness(1.2); }
.export-note { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; line-height: 1.5; }

#btn-edit{display:none !important;}#edit-only{display:none !important;}
</style>

  // ---- 人物备注（玩家给代号写真名）----
  const NOTES_KEY = "weave_os_notes_v1";
  let annotations = {}; // code -> 玩家写的名字
  function loadNotes() {
    try { const r = localStorage.getItem(NOTES_KEY); if (r) annotations = JSON.parse(r) || {}; } catch (e) {}
  }
  function saveNotes() {
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(annotations)); } catch (e) {}
  }
  function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  function applyAnnotations(text) {
    let out = String(text == null ? "" : text);
    // 长代号先替换，避免 VOX-1 抢先吃掉 VOX-12 这类前缀
    Object.keys(annotations)
      .sort((a, b) => b.length - a.length)
      .forEach((code) => {
        const name = (annotations[code] || "").trim();
        if (!name) return;
        out = out.replace(new RegExp(escapeRe(code), "g"), name);
      });
    return out;
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // 密码比对前的归一化：去掉空格与常见标点，让“别把我留下来。”这类口令更宽容。
  function normPass(s) {
    return String(s == null ? "" : s)
      .trim()
      .toUpperCase()
      .replace(/[\s，。、！？,.!?；;：:'"‘’“”「」『』（）()【】\[\]\-—_~·]/g, "");
  }

  function rosterSpeakerTokens() {
    const tokens = [];
    (DESKTOP.roster || []).forEach((r) => {
      if (!r) return;
      if (r.code) tokens.push(r.code);
      if (r.machineId) tokens.push(r.machineId);
    });
    tokens.push("未知声纹", "声纹无法识别", "识别失败");
    return tokens.filter(Boolean);
  }

  // 行首是某个声纹代号 / 机器编号 + “：” 时，把说话人名字（含冒号）标成浅蓝色。
  // 只认花名册里的代号，避免把“自动输液剂量校验：”这种设备读数也染色。
  function speakerRegex() {
    const codes = rosterSpeakerTokens()
      .sort((a, b) => b.length - a.length)
      .map(escapeRe);
    if (!codes.length) return null;
    return new RegExp("^(\\s*)(" + codes.join("|") + ")：([\\s\\S]*)$");
  }

  function renderTxt(div, raw) {
    const re = speakerRegex();
    const html = String(raw == null ? "" : raw)
      .split("\n")
      .map((line) => {
        const m = re && line.match(re);
        if (m) {
          return (
            escapeHtml(m[1]) +
            '<span class="speaker">' +
            escapeHtml(applyAnnotations(m[2])) +
            "：</span>" +
            escapeHtml(applyAnnotations(m[3]))
          );
        }
        return escapeHtml(applyAnnotations(line));
      })
      .join("\n");
    div.innerHTML = html;
  }

  // ---- 玩家给日志改名（标记推断出的时间/含义）----
  const FILENAME_KEY = "weave_os_filenames_v1";
  let playerNames = {}; // __id -> 玩家起的名字
  function loadPlayerNames() {
    try { const r = localStorage.getItem(FILENAME_KEY); if (r) playerNames = JSON.parse(r) || {}; } catch (e) {}
  }
  function savePlayerNames() {
    try { localStorage.setItem(FILENAME_KEY, JSON.stringify(playerNames)); } catch (e) {}
  }
  function displayName(node) {
    const p = playerNames[node.__id];
    return (p != null && p !== "") ? p : (node.name || "(未命名)");
  }

  // ---- 记录玩家“看过”了哪些记录（用于按角色检索对话）----
  const VIEWED_KEY = "weave_os_viewed_v1";
  const nodeById = {};          // __id -> node（reindex 时填充）
  const nodeBySlot = {};        // slot -> node（用于逐层揭示）
  let viewed = {};              // __id -> true（看过的记录）
  function loadViewed() {
    try { const r = localStorage.getItem(VIEWED_KEY); if (r) viewed = JSON.parse(r) || {}; } catch (e) {}
  }
  function saveViewed() {
    try { localStorage.setItem(VIEWED_KEY, JSON.stringify(viewed)); } catch (e) {}
  }
  function markViewed(node) {
    if (viewed[node.__id]) return;
    viewed[node.__id] = true;
    saveViewed();
    renderDesktop();          // 可能有新一层记录该出现了
    refreshOpenFolders();
  }

  // ---- 玩家用“调律台”还原过的【单个文件】：被还原的 revealByTune 文件会出现 ----
  // 每个隐藏文件单独配置自己的还原条件(node.memory)，不再和所在文件夹绑定。
  const TUNED_KEY = "weave_os_tuned_v2";
  let tunedNodes = {};          // 文件 __id -> true
  function loadTuned() {
    try { const r = localStorage.getItem(TUNED_KEY); if (r) tunedNodes = JSON.parse(r) || {}; } catch (e) {}
  }
  function saveTuned() {
    try { localStorage.setItem(TUNED_KEY, JSON.stringify(tunedNodes)); } catch (e) {}
  }

  const desktop = document.getElementById("desktop");
  const iconLayer = document.getElementById("icon-layer");
  const inspector = document.getElementById("inspector");
  const addTargetTag = document.getElementById("add-target");

  const unlocked = {};        // __id -> true
  const openWindows = {};     // __id -> { win, node }
  let zCounter = 100;
  let idSeq = 1;

  let editMode = false;
  let selected = null;        // 当前选中的节点
  let addContainer = DESKTOP.items; // 新建时放进哪个数组
  let addTargetName = "桌面";

  // ---- 自动保存草稿（localStorage）----
  const DRAFT_KEY = "weave_os_draft_v1";
  let ORIGINAL_FILE_SIG = "";   // 启动时文件版本的指纹，用于判断文件是否被手改过
  let saveTimer = null;

  function cleanClone(v) {
    if (Array.isArray(v)) return v.map(cleanClone);
    if (v && typeof v === "object") {
      const o = {};
      Object.keys(v).forEach((k) => { if (k.indexOf("__") !== 0) o[k] = cleanClone(v[k]); });
      return o;
    }
    return v;
  }

  function saveDraft() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        baseSig: ORIGINAL_FILE_SIG,
        data: cleanClone(DESKTOP),
        at: Date.now(),
      }));
      updateDraftStatus(true);
    } catch (e) { /* 隐私模式等情况，静默失败 */ }
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 350);
  }

  function loadDraft() {
    let raw;
    try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { return false; }
    if (!raw) return false;
    let saved;
    try { saved = JSON.parse(raw); } catch (e) { return false; }
    // 文件被手动改过（指纹对不上）-> 丢弃旧草稿，以文件为准
    if (!saved || saved.baseSig !== ORIGINAL_FILE_SIG) {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      return false;
    }
    Object.keys(saved.data).forEach((k) => { DESKTOP[k] = saved.data[k]; });
    return true;
  }

  function updateDraftStatus(justSaved) {
    const el = document.getElementById("draft-status");
    if (!el) return;
    if (justSaved) {
      const t = new Date();
      const hh = String(t.getHours()).padStart(2, "0");
      const mm = String(t.getMinutes()).padStart(2, "0");
      el.textContent = "● 草稿已自动保存 " + hh + ":" + mm;
      el.classList.add("saved");
    } else {
      el.textContent = "自动保存：开";
      el.classList.remove("saved");
    }
  }

  function resetToFile() {
    if (!confirm("放弃所有未导出的改动，回到 desktop-data.js 文件版本？")) return;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    location.reload();
  }

  // ---- 给每个节点分配稳定 id，并记录它所在的数组(便于删除) ----
  function reindex(items, parentFolder) {
    items.forEach((node) => {
      if (node.__id == null) node.__id = "n" + idSeq++;
      nodeById[node.__id] = node;
      if (node.slot) nodeBySlot[node.slot] = node;
      node.__parentArray = items;
      node.__parentFolder = parentFolder || null;
      if (node.type === "folder") {
        node.children = node.children || [];
        reindex(node.children, node);
      }
    });
  }

  // 逐层揭示：带 hiddenUntil 的节点，要等到对应 slot 的记录被“看过”才出现
  // 在“游玩模式”下这个节点是否应隐藏（不看 editMode）
  function hiddenInPlay(node) {
    // 需要用“调律台”单独还原这个文件后，它才出现
    if (node.revealByTune) {
      if (!tunedNodes[node.__id]) return true;
    }
    if (node.hiddenUntil) {
      const pre = nodeBySlot[node.hiddenUntil];
      if (!(pre && viewed[pre.__id])) return true;
    }
    return false;
  }
  function isHidden(node) {
    if (editMode) return false;            // 编辑模式下全部可见（半透明显示，方便作者改）
    return hiddenInPlay(node);
  }

  // 这个隐藏文件的“还原条件”：优先用文件自己的 memory；
  // 没单独设置时，回退到所在文件夹的 memory（向后兼容旧数据）。
  function tuneConditionOf(node) {
    if (node.memory && Array.isArray(node.memory.cast) && node.memory.cast.length) return node.memory;
    const f = node.__parentFolder;
    if (f && f.memory && Array.isArray(f.memory.cast) && f.memory.cast.length) return f.memory;
    return null;
  }

  // 文件夹里所有“可被调律台还原”的隐藏文件
  function tuneTargetsIn(folder) {
    if (!folder || folder.type !== "folder" || !Array.isArray(folder.children)) return [];
    return folder.children.filter((c) => c && c.revealByTune);
  }
  // 文件夹是否有“可被调律台还原”的隐藏内容
  function folderHasTuneTarget(node) {
    return tuneTargetsIn(node).some((c) => !!tuneConditionOf(c));
  }

  // ---- 系统信息 ----
  document.getElementById("system-name").textContent = DESKTOP.systemName || "";
  document.getElementById("boot-line").textContent = DESKTOP.bootLine || "";

  /* ===================================================================
   *  渲染
   * =================================================================== */
  function renderDesktop() {
    iconLayer.innerHTML = "";
    let autoIndex = 0;
    DESKTOP.items.forEach((node) => {
      if (isHidden(node)) return;          // 还没解锁到这一层，先不显示
      // 没有坐标的，自动排成一列一列的网格
      if (typeof node.x !== "number" || typeof node.y !== "number") {
        const col = Math.floor(autoIndex / 6);
        const row = autoIndex % 6;
        node.x = 24 + col * 104;
        node.y = 24 + row * 96;
      }
      autoIndex++;
      const el = makeIcon(node, true);
      el.style.left = node.x + "px";
      el.style.top = node.y + "px";
      iconLayer.appendChild(el);
    });
  }

  function refreshOpenFolders() {
    Object.keys(openWindows).forEach((id) => {
      const rec = openWindows[id];
      if (rec.node && rec.node.type === "folder") {
        const body = rec.win.querySelector(".folder-body");
        if (body) fillFolderBody(body, rec.node);
      }
    });
  }

  function renderAll() {
    reindex(DESKTOP.items);
    renderDesktop();
    refreshOpenFolders();
  }

  // ---- 单个图标 ----
  function makeIcon(node, isRoot) {
    const el = document.createElement("div");
    el.className = "icon";
    if (selected === node) el.classList.add("selected");
    // 编辑模式下，游玩时会被隐藏的文件半透明显示，提示作者“这个玩家暂时看不到”
    if (editMode && hiddenInPlay(node)) el.classList.add("hidden-stub");
    node.__iconEl = el;

    let glyph;
    if (ICON_IMG[node.type]) {
      glyph = document.createElement("img");
      glyph.className = "glyph";
      glyph.src = ICON_IMG[node.type];
      glyph.alt = node.type;
      glyph.draggable = false;
    } else {
      // notes 等没有专属图片的，用 emoji 占位
      glyph = document.createElement("span");
      glyph.className = "glyph-emoji";
      glyph.textContent = ICON_GLYPH[node.type] || "❓";
    }

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = displayName(node);

    el.appendChild(glyph);
    el.appendChild(label);

    if (node.locked) {
      const badge = document.createElement("span");
      badge.className = "lock-badge";
      badge.textContent = "🔒";
      el.appendChild(badge);
      if (unlocked[node.__id]) el.classList.add("unlocked");
    }

    // 事件：编辑模式=选中(根图标可拖)，普通模式=点选/双击打开
    if (isRoot && editMode) {
      attachDrag(el, node);
    }
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (editMode) selectNode(node);
      else highlightOnly(el);
    });
    el.addEventListener("dblclick", (e) => {
      e.stopPropagation();
      openItem(node);
    });

    return el;
  }

  function highlightOnly(el) {
    document.querySelectorAll(".icon.selected").forEach((n) => n.classList.remove("selected"));
    el.classList.add("selected");
  }

  /* ===================================================================
   *  打开节点（txt / img / folder / 上锁）
   * =================================================================== */
  function openItem(node) {
    if (openWindows[node.__id]) { focusWindow(openWindows[node.__id].win, node); return; }
    if (node.locked && !unlocked[node.__id]) { openLockDialog(node); return; }

    if (node.type === "notes") { openNotesApp(node); return; }
    if (node.type === "tuner") { openTunerApp(node); return; }

    if (node.type === "txt" || node.type === "img") markViewed(node);

    let body;
    if (node.type === "txt") body = buildTxtBody(node);
    else if (node.type === "img") body = buildImgBody(node);
    else if (node.type === "folder") body = buildFolderBody(node);
    else { body = document.createElement("div"); body.textContent = "未知类型: " + node.type; }
    createWindow(node, body);
  }

  function rawText(node) {
    return Array.isArray(node.content) ? node.content.join("\n") : String(node.content || "");
  }

  function buildTxtBody(node) {
    const div = document.createElement("div");
    div.className = "txt-body";
    renderTxt(div, rawText(node));
    return div;
  }

  function buildImgBody(node) {
    const div = document.createElement("div");
    div.className = "img-body";
    const img = document.createElement("img");
    img.src = node.src || "";
    img.alt = node.name || "";
    img.draggable = false;
    div.appendChild(img);
    if (node.caption) {
      const cap = document.createElement("div");
      cap.className = "caption";
      cap.textContent = applyAnnotations(node.caption);
      div.appendChild(cap);
    }
    return div;
  }

  function buildFolderBody(node) {
    const div = document.createElement("div");
    div.className = "folder-body";
    fillFolderBody(div, node);
    return div;
  }

  function fillFolderBody(div, node) {
    div.innerHTML = "";
    const children = node.children || [];
    if (children.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "（空文件夹）";
      div.appendChild(empty);
    } else {
      children.forEach((child) => { if (!isHidden(child)) div.appendChild(makeIcon(child, false)); });
    }
  }

  /* ===================================================================
   *  人物备注程序
   * =================================================================== */
  function firstHeaderLine(node) {
    const lines = Array.isArray(node.content) ? node.content : String(node.content || "").split("\n");
    for (let i = 0; i < lines.length; i++) {
      if (lines[i] && lines[i].trim()) return lines[i].trim();
    }
    return "";
  }

  // 玩家“看过的、且出现了某代号”的对话记录
  function viewedRecordsWith(code) {
    const out = [];
    Object.keys(viewed).forEach((id) => {
      const n = nodeById[id];
      if (!n || n.type !== "txt") return;
      if (rawText(n).indexOf(code) !== -1) out.push(n);
    });
    return out;
  }

  function openNotesApp(node) {
    const wrap = document.createElement("div");
    wrap.className = "notes-app";

    const intro = document.createElement("div");
    intro.className = "notes-intro";
    intro.textContent = node.appIntro ||
      "为每个声纹写下你推断出的真名（会自动替换全文）。点声纹编号，可查看你看过的、ta 参与过的对话。";
    wrap.appendChild(intro);

    const roster = DESKTOP.roster || [];
    roster.forEach((r) => {
      const row = document.createElement("div");
      row.className = "notes-row";

      const left = document.createElement("div");
      left.className = "notes-code";
      const codeEl = document.createElement("div");
      codeEl.className = "code";
      codeEl.textContent = r.code;
      const caret = document.createElement("span");
      caret.className = "code-caret";
      left.appendChild(codeEl);
      left.appendChild(caret);

      const inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "写下真名…";
      inp.value = annotations[r.code] || "";

      const list = document.createElement("div");
      list.className = "notes-dialogs";
      list.style.display = "none";

      function renderDialogList() {
        list.innerHTML = "";
        const recs = viewedRecordsWith(r.code);
        const count = document.createElement("div");
        count.className = "notes-dialogs-count";
        count.textContent = recs.length
          ? "你看过的、ta 参与过的对话（" + recs.length + "）"
          : "你还没看过 ta 参与的任何对话。";
        list.appendChild(count);
        recs.forEach((n) => {
          const item = document.createElement("div");
          item.className = "notes-dialog-item";
          const t = document.createElement("div");
          t.className = "ndi-title";
          t.textContent = displayName(n);
          const s = document.createElement("div");
          s.className = "ndi-sub";
          s.textContent = firstHeaderLine(n);
          item.appendChild(t);
          item.appendChild(s);
          item.addEventListener("click", () => openItem(n));
          list.appendChild(item);
        });
      }

      inp.addEventListener("input", () => {
        annotations[r.code] = inp.value;
        saveNotes();
        refreshAnnotated();
        if (list.style.display !== "none") renderDialogList();
      });

      let open = false;
      function toggle() {
        open = !open;
        row.classList.toggle("expanded", open);
        list.style.display = open ? "block" : "none";
        if (open) renderDialogList();
      }
      codeEl.addEventListener("click", toggle);
      caret.addEventListener("click", toggle);

      row.appendChild(left);
      row.appendChild(inp);
      wrap.appendChild(row);
      wrap.appendChild(list);
    });

    createWindow(node, wrap, { notes: true });
  }

  // 备注变化后，刷新所有已打开的文本/图片窗口里的代号显示
  function refreshAnnotated() {
    Object.keys(openWindows).forEach((id) => {
      const rec = openWindows[id];
      const n = rec.node;
      if (!n) return;
      if (n.type === "txt") {
        const b = rec.win.querySelector(".txt-body");
        if (b) renderTxt(b, rawText(n));
      } else if (n.type === "img" && n.caption) {
        const c = rec.win.querySelector(".caption");
        if (c) c.textContent = applyAnnotations(n.caption);
      }
      // 锁对话框里标了 data-anno 的元素（排序标签 / 认人按钮 / 档案锁下拉项）也跟着改名
      rec.win.querySelectorAll("[data-anno]").forEach((el) => {
        el.textContent = applyAnnotations(el.dataset.anno);
      });
    });
  }

  /* ===================================================================
   *  上锁密码框
   * =================================================================== */
  function openLockDialog(node) {
    if (node.lockType === "order") { openOrderLock(node); return; }
    if (node.lockType === "choice") { openChoiceLock(node); return; }
    if (node.lockType === "dossier") { openDossierLock(node); return; }
    if (node.lockType === "memory") { openMemoryLock(node); return; }
    // 纯数字密码 → 键盘面板
    if (/^[0-9]+$/.test(normPass(node.password))) { openNumericLock(node); return; }

    const wrap = document.createElement("div");
    wrap.className = "lock-body";
    wrap.innerHTML =
      '<div class="lock-icon">🔒</div>' +
      '<div class="hint"></div>';
    wrap.querySelector(".hint").textContent = node.lockPrompt || "此文件已加密。请输入密码。";

    const inp = document.createElement("input");
    inp.type = "text";
    inp.placeholder = "输入密码…";
    const btn = document.createElement("button");
    btn.className = "lock-btn";
    btn.textContent = "解锁";
    const err = document.createElement("div");
    err.className = "lock-error";

    wrap.appendChild(inp);
    wrap.appendChild(document.createElement("br"));
    wrap.appendChild(btn);
    wrap.appendChild(err);

    const win = createWindow(node, wrap, { lockDialog: true });
    setTimeout(() => inp.focus(), 30);

    function tryUnlock() {
      if (normPass(inp.value) === normPass(node.password)) {
        doUnlock(node, win);
      } else {
        err.textContent = "密码错误。";
        inp.select();
      }
    }
    btn.addEventListener("click", tryUnlock);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
  }

  /* ===== 数字密码键盘面板：显示位数 + 鼠标小键盘 + 键盘输入 ===== */
  function openNumericLock(node) {
    const answer = normPass(node.password);
    const len = answer.length;
    let entered = "";

    const wrap = document.createElement("div");
    wrap.className = "lock-body numpad-lock";
    wrap.innerHTML =
      '<div class="lock-icon">🔒</div>' +
      '<div class="hint"></div>';
    wrap.querySelector(".hint").textContent =
      node.lockPrompt || ("请输入 " + len + " 位数字密码");

    // 位数显示框
    const dots = document.createElement("div");
    dots.className = "numpad-dots";
    const cells = [];
    for (let i = 0; i < len; i++) {
      const c = document.createElement("span");
      c.className = "numpad-cell";
      dots.appendChild(c);
      cells.push(c);
    }
    wrap.appendChild(dots);

    const err = document.createElement("div");
    err.className = "lock-error";

    function refresh() {
      cells.forEach((c, i) => {
        c.textContent = entered[i] || "";
        c.classList.toggle("filled", i < entered.length);
      });
    }
    function input(d) {
      if (entered.length >= len) return;
      entered += d;
      err.textContent = "";
      refresh();
      if (entered.length === len) setTimeout(verify, 120);
    }
    function back() { entered = entered.slice(0, -1); err.textContent = ""; refresh(); }
    function verify() {
      if (entered === answer) doUnlock(node, win);
      else { err.textContent = "密码错误。"; entered = ""; refresh(); }
    }

    // 小键盘
    const pad = document.createElement("div");
    pad.className = "numpad-grid";
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "back", "0", "ok"];
    keys.forEach((k) => {
      const b = document.createElement("button");
      b.className = "numpad-key";
      if (k === "back") { b.textContent = "⌫"; b.classList.add("numpad-fn"); b.addEventListener("click", back); }
      else if (k === "ok") { b.textContent = "✓"; b.classList.add("numpad-fn"); b.addEventListener("click", verify); }
      else { b.textContent = k; b.addEventListener("click", () => input(k)); }
      pad.appendChild(b);
    });
    wrap.appendChild(pad);
    wrap.appendChild(err);

    const win = createWindow(node, wrap, { lockDialog: true });

    // 键盘输入
    function onKey(e) {
      if (!document.body.contains(win)) { document.removeEventListener("keydown", onKey); return; }
      if (e.key >= "0" && e.key <= "9") { input(e.key); e.preventDefault(); }
      else if (e.key === "Backspace") { back(); e.preventDefault(); }
      else if (e.key === "Enter") { verify(); e.preventDefault(); }
    }
    document.addEventListener("keydown", onKey);
    refresh();
  }

  function doUnlock(node, win) {
    unlocked[node.__id] = true;
    if (node.__iconEl) node.__iconEl.classList.add("unlocked");
    win.remove();
    delete openWindows[node.__id];
    openItem(node);
  }

  /* ===== 排序锁：把若干人/物按正确顺序排好才能解锁 ===== */
  function openOrderLock(node) {
    const wrap = document.createElement("div");
    wrap.className = "lock-body order-lock";

    const icon = document.createElement("div");
    icon.className = "lock-icon";
    icon.textContent = "🔒";
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = node.orderPrompt || "把下面的项目按正确顺序排好。";
    wrap.appendChild(icon);
    wrap.appendChild(hint);

    // 当前顺序（用代号数组表示），初始用作者给的 orderItems
    let current = (node.orderItems || []).slice();

    const listEl = document.createElement("div");
    listEl.className = "order-list";
    wrap.appendChild(listEl);

    function render() {
      listEl.innerHTML = "";
      current.forEach((code, i) => {
        const row = document.createElement("div");
        row.className = "order-row";

        const rank = document.createElement("span");
        rank.className = "order-rank";
        rank.textContent = (i + 1) + ".";

        const label = document.createElement("span");
        label.className = "order-label";
        label.dataset.anno = code;
        label.textContent = applyAnnotations(code);

        const ups = document.createElement("div");
        ups.className = "order-arrows";
        const up = document.createElement("button");
        up.className = "order-arrow";
        up.textContent = "▲";
        up.disabled = i === 0;
        up.addEventListener("click", () => { swap(i, i - 1); });
        const down = document.createElement("button");
        down.className = "order-arrow";
        down.textContent = "▼";
        down.disabled = i === current.length - 1;
        down.addEventListener("click", () => { swap(i, i + 1); });
        ups.appendChild(up);
        ups.appendChild(down);

        row.appendChild(rank);
        row.appendChild(label);
        row.appendChild(ups);
        listEl.appendChild(row);
      });
    }
    function swap(a, b) {
      const t = current[a]; current[a] = current[b]; current[b] = t;
      err.textContent = "";
      render();
    }
    render();

    const btn = document.createElement("button");
    btn.className = "lock-btn";
    btn.textContent = "确认顺序";
    const err = document.createElement("div");
    err.className = "lock-error";
    wrap.appendChild(btn);
    wrap.appendChild(err);

    const win = createWindow(node, wrap, { lockDialog: true });

    btn.addEventListener("click", () => {
      const ans = node.orderAnswer || [];
      const ok = current.length === ans.length &&
        current.every((c, i) => c === ans[i]);
      if (ok) doUnlock(node, win);
      else { err.textContent = "顺序不对。再想想 ta 是怎么看这些人的。"; }
    });
  }

  /* ===== 认人锁：从若干声纹里选出正确的那个 ===== */
  function openChoiceLock(node) {
    const wrap = document.createElement("div");
    wrap.className = "lock-body choice-lock";

    const icon = document.createElement("div");
    icon.className = "lock-icon";

        else { err.textContent = "不是 ta。再想想，现场留下的是谁。"; }
      });
      wrap.appendChild(b);

    wrap.appendChild(err);
